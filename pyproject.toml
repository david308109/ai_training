[project]
name = "data-agent"
version = "0.1.0"
description = "Text-to-SQL Data Agent using FastAPI, LangChain, and OpenSearch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "opensearch-py>=2.7.0",
    "sentence-transformers>=3.0.0",
    "sqlparse>=0.5.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

